# PATHS
package_path: /home/tommaso/git_workspace/AutoDFTB
dftb_bin_path: /home/tommaso/Applications/dftbplus/bin/dftb+
slakos: /home/tommaso/Applications/dftbplus/slakos/pbc-0-3
setupgeom_bin_path: /home/tommaso/Applications/dftbplus/bin/setupgeom
working_dir: ${package_path}/tmp

electrodes_dir: ${package_path}/data/transport/electrodes_test
gen_dir: ${package_path}/data/transport/gen_files
transport_output: ${package_path}/data/transport/transport_output

# BOX SIZE
periodic: True
box_size: [50.0, 0.0, 0.0, 0.0, 34.25591181, 0.0, 0.0, 0.0, 40.0]

# ELECTRODE
electrode_cell:
  [4.9390060733739025, 0.0, 0.0, 0.0, 34.25591181, 0.0, 0.0, 0.0, 10.0]

#SETUPGEOM
plsdefined: 1

#CONTACT
fermi_temperature: 0.0

#TRANSPORT
potential_source: 0.05
potential_drain: -0.05
tunnelinganddos:
  verbosity: 100
  offset_energy_range: 0.5
  resolution: 350
  compute_ldos: "Yes"

# SLURM
slurm_job_name: Graphene_Transport
slurm_mem:
slurm_ncpus: 16
slurm_nodelist:
slurm_partition: long
slurm_timeout: 2800
slurm_output: outputs/slurm_out
slurm_exclude:

# VERBOSITY
verbose: True
