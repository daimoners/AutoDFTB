# PATHS
package_path: /home/tommaso/git_workspace/AutoDFTB
dftb_bin_path: /home/tommaso/Applications/dftbplus/bin/dftb+
slakos: /home/tommaso/Applications/dftbplus/slakos/pbc-0-3/
xyz_dir: ${package_path}/data/dftb/xyz_files
poscar_dir: ${package_path}/data/dftb/poscar_files
json_dir: ${package_path}/data/dftb/json_files
working_dir: ${package_path}/tmp

# BOX SIZE
periodic: True
box_size: [34.43317005, 0.0, 0.0, 0.0, 34.08, 0.0, 0.0, 0.0, 10.0]

# DFTB
optimize_geometry: False
charge: 0
